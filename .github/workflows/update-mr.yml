name: MR自動更新

on:
  schedule:
    # 1日1回実行(UTC 9:00 = JST 18:00)。メトログラフのCSVは1日1回程度の更新のため十分な頻度。
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "update-mr"
  cancel-in-progress: true

jobs:
  update-mr:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 依存パッケージをインストール
        run: npm install --no-audit --no-fund

      - name: MRを更新
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/update-mr.mjs
